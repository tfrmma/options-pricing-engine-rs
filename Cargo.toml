[package]
name = "options_pricing_engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "options_pricing_engine"
path = "src/main.rs"

[[bin]]
name = "gen_rbergomi_dataset"
path = "src/gen_rbergomi_dataset.rs"

[lib]
name = "options_pricing_engine"
path = "src/lib.rs"

[dependencies]
num-complex = "0.4"
num-traits = "0.2"
rayon = "1.8"
libm = "0.2"
rand = { version = "0.8", features = ["small_rng"] }
realfft = "3.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
